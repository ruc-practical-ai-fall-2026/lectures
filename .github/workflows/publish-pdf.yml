
name: Publish PDFs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Pandoc and LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc \
            texlive-xetex \
            texlive-latex-extra \
            fonts-lmodern

      - name: Generate PDFs
        run: |
          mkdir -p _site
          ./make-pdfs.sh

          while IFS= read -r markdown; do
            [[ -z "$markdown" ]] && continue
            pdf="${markdown%.md}.pdf"
            mkdir -p "_site/$(dirname "$pdf")"
            cp "$pdf" "_site/$pdf"
          done < <(sed -n '/^pdfs:/,$ { /^[[:space:]]*-[[:space:]]*/ { s///; p; } }' pdfs.yaml)

      - name: Create download page
        run: |
          cat > _site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Practical AI lecture PDFs</title>
          </head>
          <body>
            <h1>Practical AI lecture PDFs</h1>
            <p><a href="class-06/notebooks/01_model_scaling_tutorial.pdf">Model Scaling Tutorial</a></p>
          </body>
          </html>
          EOF

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
